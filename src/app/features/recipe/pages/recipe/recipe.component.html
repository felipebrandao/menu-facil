<app-success-modal
  *ngIf="showSuccessModal"
  (view)="onViewRecipe()"
  (back)="onBackToList()"
></app-success-modal>
<app-error-modal
  *ngIf="showErrorModal"
  [message]="'Erro ao salvar receita!'"
  [details]="'Por favor, tente novamente.'"
  (retry)="onRetry()"
  (cancel)="onCancel()"
></app-error-modal>
<main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h2 class="text-3xl font-bold mb-6">Adicionar nova receita</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col lg:flex-row gap-8">
    <div class="lg:w-2/3 space-y-6">
      <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="recipe-name">Nome da
              receita <span class="text-red-500">*</span></label>
            <input
              id="recipe-name"
              class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
              [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': recipeName?.invalid && recipeName?.touched}"
              placeholder="Ex: Bolo de Chocolate, Salada Caesar, etc."
              type="text"
              formControlName="recipeName"
              required
            />
            <div *ngIf="recipeName?.invalid && recipeName?.touched" class="text-red-500 text-sm">
              Nome da receita é obrigatório.
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="category">Categoria
              <span class="text-red-500">*</span></label>
            <div class="flex items-center gap-2">
              <select
                id="category"
                class="w-full bg-white dark:bg-gray-900 border rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary border-gray-300 dark:border-gray-700"
                [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': category?.invalid && category?.touched}"
                formControlName="category"
                required
              >
                <option ngValue="''">Selecione uma categoria</option>
                <option *ngFor="let cat of categories" [ngValue]="cat">{{ cat.name }}</option>
              </select>
              <button type="button"
                      (click)="openCategoryModal()"
                      class="h-10 w-10 flex items-center justify-center bg-gray-100 dark:bg-gray-800 rounded-md
               hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                <span class="material-symbols-outlined">add</span>
              </button>
            </div>
            <div *ngIf="category?.invalid && category?.touched" class="text-red-500 text-sm">
              Categoria é obrigatória.
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="total-time">Tempo
                Total (minutos)</label>
              <input
                id="total-time"
                class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                placeholder="Ex: 45"
                type="number"
                formControlName="totalTime"
              />
              <div *ngIf="totalTime?.invalid && totalTime?.touched" class="text-red-500 text-sm">
                O tempo deve ser um número válido.
              </div>
            </div>

            <div class="flex flex-col h-full justify-center pt-2">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Favorito</label>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  (click)="toggleFavorite()"
                  aria-label="Favoritar"
                  class="p-2 rounded-full transition-colors"
                >
                  <span class="material-icons text-base" [ngClass]="{'text-red-500': highlighted?.value}" aria-hidden="true">
                    {{ highlighted?.value ? 'favorite' : 'favorite_border' }}
                  </span>
                </button>
              </div>
            </div>
          </div>

          <app-recipe-instructions
            [instructions]="instructionsArray">
          </app-recipe-instructions>
        </div>
      </div>
    </div>
    <div class="lg:w-1/3 space-y-6">
      <div class="mb-6">
        <app-recipe-ingredients-form
          formControlName="ingredients"
          [ingredientError]="ingredientError"
          (ingredientsChange)="onIngredientsChange($event)">
        </app-recipe-ingredients-form>
      </div>
      <app-recipe-images
        [(mainImage)]="mainImage"
        [(galleryImages)]="galleryImages">
      </app-recipe-images>
      <button
        type="submit"
        class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
      >
        <span class="material-symbols-outlined mr-2">save</span>
        Salvar Receita
      </button>
    </div>
  </form>

  <app-new-category-modal
    *ngIf="showCategoryModal"
    (saved)="onCategorySaved($event)"
    (closed)="onCategoryClosed()">
  </app-new-category-modal>
</main>
