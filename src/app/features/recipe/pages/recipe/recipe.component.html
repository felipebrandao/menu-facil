<app-success-modal
  *ngIf="showSuccessModal"
  [title]="'Receita salva com sucesso!'"
  [message]="'A receita foi salva com sucesso.'"
  [buttonText]="'Voltar para Lista'"
  (close)="onSuccessModalClose()"
></app-success-modal>
<app-error-modal
  *ngIf="showErrorModal"
  [message]="'Erro ao salvar receita!'"
  [details]="'Por favor, tente novamente.'"
  (retry)="onRetry()"
  (cancel)="onCancel()"
></app-error-modal>

<div
  *ngIf="isBlocking"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  aria-busy="true"
  aria-live="polite"
>
  <div class="flex items-center gap-3 rounded-lg bg-white dark:bg-gray-900 px-5 py-4 shadow">
    <svg class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
    </svg>
    <span class="text-sm text-gray-800 dark:text-gray-200">
      {{ isSaving ? 'Salvando receita...' : 'Carregando...' }}
    </span>
  </div>
</div>

<main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h2 class="text-3xl font-bold mb-6">{{ loading ? 'Carregando receita...' : (lastRecipeId ? 'Editar receita' : 'Adicionar nova receita') }}</h2>

  <ng-container *ngIf="!loading; else loadingSkeleton">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col lg:flex-row gap-8">
    <div class="lg:w-2/3 space-y-6">
        <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="recipe-name">Nome da
                receita <span class="text-red-500">*</span></label>
              <input
                id="recipe-name"
                class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': recipeName?.invalid && recipeName?.touched}"
                placeholder="Ex: Bolo de Chocolate, Salada Caesar, etc."
                type="text"
                formControlName="recipeName"
                required
              />
              <div *ngIf="recipeName?.invalid && recipeName?.touched" class="text-red-500 text-sm">
                Nome da receita é obrigatório.
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="category">Categoria
                <span class="text-red-500">*</span></label>
              <div class="flex items-center gap-2">
                <select
                  id="category"
                  class="w-full bg-white dark:bg-gray-900 border rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary border-gray-300 dark:border-gray-700"
                  [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': category?.invalid && category?.touched}"
                  formControlName="category"
                  required
                >
                  <option value="" disabled hidden>Selecione uma categoria</option>
                  <option *ngFor="let cat of categories" [value]="cat.id">
                    {{ cat.name }}
                  </option>
                </select>
                <button type="button"
                        (click)="openCategoryModal()"
                        class="h-10 w-10 flex items-center justify-center bg-gray-100 dark:bg-gray-800 rounded-md
                 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
              <div *ngIf="category?.invalid && category?.touched" class="text-red-500 text-sm">
                Categoria é obrigatória.
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="total-time">Tempo
                  Total (minutos)</label>
                <input
                  id="total-time"
                  class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                  placeholder="Ex: 45"
                  type="number"
                  formControlName="totalTime"
                />
                <div *ngIf="totalTime?.invalid && totalTime?.touched" class="text-red-500 text-sm">
                  O tempo deve ser um número válido.
                </div>
              </div>

              <div class="flex flex-col h-full justify-center pt-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Favorito</label>
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    (click)="toggleFavorite()"
                    aria-label="Favoritar"
                    class="p-2 rounded-full transition-colors"
                  >
                    <span class="material-icons text-base" [ngClass]="{'text-red-500': highlighted?.value}" aria-hidden="true">
                      {{ highlighted?.value ? 'favorite' : 'favorite_border' }}
                    </span>
                  </button>
                </div>
              </div>
            </div>

            <app-recipe-instructions
              [instructions]="instructionsArray">
            </app-recipe-instructions>
          </div>
        </div>
      </div>
      <div class="lg:w-1/3 space-y-6">
        <div class="mb-6">
          <app-recipe-ingredients-form
            formControlName="ingredients"
            [ingredientError]="ingredientError"
            (ingredientsChange)="onIngredientsChange($event)"
            (openIngredientModal)="onOpenIngredientModal($event)">
          </app-recipe-ingredients-form>
        </div>
        <app-recipe-images
          [(mainImage)]="mainImage"
          [(galleryImages)]="galleryImages">
        </app-recipe-images>
        <button
          type="submit"
          [disabled]="form.invalid || isSaving"
          class="group relative w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span [class.hidden]="isSaving" class="flex items-center">
            <span class="material-symbols-outlined mr-2">save</span>
            Salvar Receita
          </span>

          <span *ngIf="isSaving" class="flex items-center gap-2">
            <svg class="h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
            </svg>
            Salvando...
          </span>
        </button>
      </div>
    </form>
  </ng-container>

  <ng-template #loadingSkeleton>
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Coluna principal - Skeleton -->
      <div class="lg:w-2/3 space-y-6">
        <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
          <div class="space-y-6">
            <!-- Nome da receita -->
            <div>
              <app-skeleton [rows]="1" [heightClass]="'h-4'" [widthClass]="'w-32'" class="mb-2"></app-skeleton>
              <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
            </div>

            <!-- Categoria -->
            <div>
              <app-skeleton [rows]="1" [heightClass]="'h-4'" [widthClass]="'w-24'" class="mb-2"></app-skeleton>
              <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
            </div>

            <!-- Tempo e Favorito -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="md:col-span-2">
                <app-skeleton [rows]="1" [heightClass]="'h-4'" [widthClass]="'w-36'" class="mb-2"></app-skeleton>
                <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
              </div>
              <div>
                <app-skeleton [rows]="1" [heightClass]="'h-4'" [widthClass]="'w-20'" class="mb-2"></app-skeleton>
                <app-skeleton [rows]="1" [heightClass]="'h-10'" [widthClass]="'w-10'" [rounded]="true"></app-skeleton>
              </div>
            </div>

            <!-- Instruções -->
            <div>
              <app-skeleton [rows]="1" [heightClass]="'h-4'" [widthClass]="'w-28'" class="mb-4"></app-skeleton>
              <div class="space-y-4">
                <app-skeleton [rows]="1" [heightClass]="'h-24'"></app-skeleton>
                <app-skeleton [rows]="1" [heightClass]="'h-24'"></app-skeleton>
                <app-skeleton [rows]="1" [heightClass]="'h-24'"></app-skeleton>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Coluna lateral - Skeleton -->
      <div class="lg:w-1/3 space-y-6">
        <!-- Ingredientes -->
        <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
          <app-skeleton [rows]="1" [heightClass]="'h-6'" [widthClass]="'w-32'" class="mb-4"></app-skeleton>
          <div class="space-y-4">
            <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
            <div class="grid grid-cols-2 gap-4">
              <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
              <app-skeleton [rows]="1" [heightClass]="'h-12'"></app-skeleton>
            </div>
            <app-skeleton [rows]="3" [heightClass]="'h-16'" [gap]="8"></app-skeleton>
          </div>
        </div>

        <!-- Imagens -->
        <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border space-y-6">
          <div>
            <app-skeleton [rows]="1" [heightClass]="'h-6'" [widthClass]="'w-40'" class="mb-4"></app-skeleton>
            <app-skeleton [rows]="1" [heightClass]="'h-48'" [rounded]="true"></app-skeleton>
          </div>
          <div>
            <app-skeleton [rows]="1" [heightClass]="'h-6'" [widthClass]="'w-36'" class="mb-4"></app-skeleton>
            <div class="grid grid-cols-3 gap-4">
              <app-skeleton [rows]="1" [heightClass]="'h-24'" [rounded]="true"></app-skeleton>
              <app-skeleton [rows]="1" [heightClass]="'h-24'" [rounded]="true"></app-skeleton>
              <app-skeleton [rows]="1" [heightClass]="'h-24'" [rounded]="true"></app-skeleton>
            </div>
          </div>
        </div>

        <!-- Botão salvar -->
        <app-skeleton [rows]="1" [heightClass]="'h-12'" [rounded]="true"></app-skeleton>
      </div>
    </div>
  </ng-template>

  <app-new-category-modal
    *ngIf="showCategoryModal"
    (saved)="onCategorySaved($event)"
    (closed)="onCategoryClosed()">
  </app-new-category-modal>

  <app-new-ingredient-modal
    *ngIf="showIngredientModal"
    [formData]="ingredientModalFormData"
    (saved)="onIngredientModalSaved($event)"
    (closed)="onIngredientModalClosed()">
  </app-new-ingredient-modal>
</main>
