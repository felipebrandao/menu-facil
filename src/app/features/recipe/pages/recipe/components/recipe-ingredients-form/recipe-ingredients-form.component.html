<div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
  <h3 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Ingredientes</h3>
  <div class="grid grid-cols-1 gap-4">
    <div class="relative col-span-2">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
             for="ingredient">Ingrediente</label>
      <div class="flex items-end gap-2">
        <app-ingredient-autocomplete
          class="flex-1"
          [placeholder]="'Ex: Farinha de trigo, açúcar, etc.'"
          [(value)]="ingredientForm.value.name"
          (selected)="onIngredientSelected($event)"
          (register)="openNewIngredientModal($event)">
        </app-ingredient-autocomplete>

        <button
          *ngIf="ingredientForm.value.id"
          type="button"
          class="h-10 w-10 flex items-center justify-center bg-blue-100 dark:bg-blue-900 rounded-md
             hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors"
          (click)="openEditIngredientModal()"
          title="Editar ingrediente">
          <span class="material-symbols-outlined text-blue-600 dark:text-blue-400">edit</span>
        </button>

        <button type="button"
                class="h-10 w-10 flex items-center justify-center bg-gray-100 dark:bg-gray-800 rounded-md
                   hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                (click)="openNewIngredientModal('')"
                title="Novo ingrediente">
          <span class="material-symbols-outlined">add</span>
        </button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4" *ngIf="ingredientForm.value.id">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="quantity">Quantidade</label>
        <input id="quantity"
               class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
               type="number" [formControl]="quantityControl"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="unit">Unidade</label>
        <select id="unit"
                class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                [formControl]="unitControl">
          <option *ngFor="let u of availableUnits" [value]="u.id">
            {{ u.abbreviation }}
          </option>
        </select>
      </div>
    </div>
  </div>
  <button type="button" (click)="addIngredient()"
          class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-primary/90 transition-colors mt-4"
          *ngIf="ingredientForm.value.id">
    Salvar Item
  </button>
  <div
    class="mt-6"
    [ngClass]="{
    'border-2 border-dashed border-red-300 dark:border-red-700 rounded-md p-4 text-center': ingredientError
  }"
  >
    <h4 class="text-lg font-bold mb-2 text-gray-900 dark:text-white">
      Lista de Ingredientes <span class="text-red-500">*</span>
    </h4>
    <ng-container *ngIf="!loading; else loadingTpl">
      <ul>
        <li *ngFor="let ing of ingredients; let i = index"
            class="flex flex-col gap-2 mb-2 bg-white dark:bg-gray-900/50 rounded-lg p-3">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 sm:gap-4">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-4 flex-grow">
              <span class="font-medium text-gray-800 dark:text-gray-200">{{ ing.name }}</span>
              <span class="text-sm text-gray-500 dark:text-gray-400"
                    *ngIf="editIndex !== i">{{ ing.quantity }} {{ getUnitAbbreviation(i) }}</span>
            </div>
            <div class="flex gap-2">
              <button *ngIf="editIndex !== i" type="button" (click)="startEdit(i)"
                      class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                <span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-lg">edit</span>
              </button>
              <button *ngIf="editIndex !== i" type="button" (click)="removeIngredient(i)"
                      class="p-1 rounded-full text-red-500 hover:bg-gray-100 dark:hover:bg-gray-800">
                <span class="material-symbols-outlined text-lg">delete</span>
              </button>
            </div>
          </div>
          <div *ngIf="editIndex === i" class="flex flex-row items-start gap-2 flex-grow mt-2">
            <input
              class="w-full sm:w-20 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1 text-sm"
              type="number" [(ngModel)]="editIngredient.quantity" [name]="'editQuantity' + i" placeholder="Quantidade"/>
            <select
              class="w-full sm:w-28 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1 text-sm"
              [(ngModel)]="editIngredient.unit" [name]="'editUnit' + i">
              <option *ngFor="let u of availableUnits" [value]="u.id">
                {{ u.abbreviation }}
              </option>
            </select>
            <button type="button" (click)="saveEdit(i)"
                    class="p-1 rounded-full text-green-500 hover:bg-gray-100 dark:hover:bg-gray-800">
              <span class="material-symbols-outlined text-lg">check</span>
            </button>
            <button type="button" (click)="cancelEdit()"
                    class="p-1 rounded-full text-red-500 hover:bg-gray-100 dark:hover:bg-gray-800">
              <span class="material-symbols-outlined text-lg">close</span>
            </button>
          </div>
        </li>
      </ul>
    </ng-container>

    <ng-template #loadingTpl>
      <ul class="space-y-3">
        <li *ngFor="let n of [1,2,3,4]" class="flex p-4 rounded-lg bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 items-center justify-between gap-3 animate-pulse">
          <div class="flex-1 min-w-0">
            <div class="h-5 bg-gray-200 dark:bg-zinc-700 rounded w-1/3"></div>
            <div class="h-4 bg-gray-200 dark:bg-zinc-700 rounded w-2/3 mt-2"></div>
          </div>
          <div class="flex gap-2">
            <div class="h-8 w-8 bg-gray-200 dark:bg-zinc-700 rounded-full"></div>
            <div class="h-8 w-8 bg-gray-200 dark:bg-zinc-700 rounded-full"></div>
          </div>
        </li>
      </ul>
    </ng-template>

    <div *ngIf="ingredientError" class="text-sm text-red-600 dark:text-red-500">
      {{ ingredientError }}
    </div>
    <div *ngIf="ingredientsControls.length === 0 && !ingredientError" class="text-center py-8 text-subtle-light dark:text-subtle-dark">
      <p>Nenhum ingrediente adicionado ainda.</p>
    </div>
  </div>
</div>
