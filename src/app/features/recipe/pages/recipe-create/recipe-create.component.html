<!-- recipe-create.component.html -->
<main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h2 class="text-3xl font-bold mb-6">Adicionar nova receita</h2>
  <form (ngSubmit)="submit()" #recipeForm="ngForm" class="flex flex-col lg:flex-row gap-8">
    <div class="lg:w-2/3 space-y-6">
      <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border">
        <div class="space-y-6">
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              for="recipe-name">Nome da receita</label>
            <input
              id="recipe-name"
              class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
              placeholder="Ex: Bolo de Chocolate, Salada Caesar, etc."
              type="text"
              [(ngModel)]="recipeName"
              name="recipeName"
              required />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              for="instructions">Instruções</label>
            <textarea
              id="instructions"
              class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
              rows="8"
              placeholder="Descreva o passo a passo da receita aqui..."
              [(ngModel)]="instructions"
              name="instructions"></textarea>
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              for="category">Categoria</label>
            <select
              id="category"
              class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
              [(ngModel)]="category"
              name="category"
              required>
              <option value="">Selecione uma categoria</option>
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="lg:w-1/3 space-y-6">
      <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border border-gray-200 dark:border-gray-800">
        <h3
          class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Ingredientes</h3>
        <div class="grid grid-cols-1 gap-4">
          <div class="relative col-span-2">
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              for="ingredient">Ingrediente</label>
            <app-ingredient-autocomplete
              [placeholder]="'Ex: Farinha de trigo, açúcar, etc.'"
              (selected)="ingredient.name = $event.name"
              (register)="openNewIngredientModal()">
            </app-ingredient-autocomplete>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="quantity">Quantidade</label>
              <input
                id="quantity"
                class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                type="number"
                [(ngModel)]="ingredient.quantity"
                name="ingredientQuantity" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="unit">Unidade</label>
              <select
                id="unit"
                class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-sm focus:ring-primary focus:border-primary"
                [(ngModel)]="ingredient.unit"
                name="ingredientUnit">
                <option *ngFor="let u of units" [value]="u">{{ u }}</option>
              </select>
            </div>
          </div>
        </div>
        <button
          type="button"
          (click)="addIngredient()"
          class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-primary/90 transition-colors mt-4"
        >Salvar Item</button>
        <div class="mt-6">
          <h4 class="text-lg font-bold mb-2 text-gray-900 dark:text-white">Lista de Ingredientes</h4>
          <ul>
            <li *ngFor="let ing of ingredients; let i = index" class="flex justify-between items-center">
              {{ ing.quantity }} {{ ing.unit }} {{ ing.name }}
              <button type="button" (click)="removeIngredient(i)" class="text-red-500 ml-2">Remover</button>
            </li>
          </ul>
          <div *ngIf="ingredients.length === 0" class="text-center py-8 text-subtle-light dark:text-subtle-dark">
            <p>Nenhum ingrediente adicionado ainda.</p>
          </div>
        </div>
      </div>
      <div class="bg-background-light dark:bg-background-dark p-6 rounded-lg border border-gray-200 dark:border-gray-800 space-y-6">
        <div>
          <h3 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Imagem Principal</h3>
          <label
            class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-300 dark:border-gray-700 border-dashed rounded-lg cursor-pointer bg-white dark:bg-gray-900/50 hover:bg-gray-50 dark:hover:bg-gray-800/50"
            for="dropzone-file-main">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-4xl">cloud_upload</span>
              <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Clique para carregar</span> ou arraste e solte</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">SVG, PNG, JPG (MAX. 800x400px)</p>
            </div>
            <input class="hidden" id="dropzone-file-main" type="file" (change)="onMainImageChange($event)" />
          </label>
        </div>
        <div>
          <h3 class="text-xl font-bold mb-4">Galeria de Imagens</h3>
          <div class="grid grid-cols-3 gap-4">
            <div *ngFor="let img of galleryImages; let i = index" class="relative group">
              <img [src]="img | filePreview" alt="Gallery image" class="aspect-square w-full object-cover rounded-lg" />
              <button
                type="button"
                (click)="removeGalleryImage(i)"
                class="absolute top-1 right-1 bg-black/50 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                <span class="material-symbols-outlined text-sm">close</span>
              </button>
            </div>
            <label class="flex items-center justify-center aspect-square w-full border-2 border-gray-300 dark:border-gray-700 border-dashed rounded-lg cursor-pointer bg-white dark:bg-gray-900/50 hover:bg-gray-50 dark:hover:bg-gray-800/50" for="dropzone-file-gallery">
              <div class="flex flex-col items-center justify-center">
                <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">add_photo_alternate</span>
              </div>
              <input class="hidden" id="dropzone-file-gallery" type="file" multiple (change)="onGalleryImagesChange($event)" />
            </label>
          </div>
        </div>
      </div>
    </div>
  </form>
</main>
