<!-- src/app/features/schedule/components/schedule-monthly/schedule-monthly.component.html -->
<ng-container *ngIf="!isLoading; else monthlySkeleton">
  <div class="lg:hidden">
    <div class="calendar-grid mb-2">
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">D</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">S</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">T</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">Q</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">Q</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">S</span>
      <span class="text-center text-[10px] font-bold text-gray-400 dark:text-slate-500 py-2">S</span>
    </div>

    <div class="calendar-grid border-t border-border-light dark:border-slate-700">
      <button
        *ngFor="let day of monthDays; let i = index"
        type="button"
        class="calendar-day text-sm border-r border-b border-border-light dark:border-slate-700 last:border-r-0 focus:outline-none transition-colors"
        [disabled]="day.disabled || day.past"
        [ngClass]="{
          'text-gray-300 dark:text-slate-600 bg-transparent cursor-not-allowed': day.disabled,
          'bg-gray-50 dark:bg-slate-900/30 opacity-70 grayscale cursor-not-allowed': day.past && !day.disabled,
          'bg-emerald-50 dark:bg-emerald-900/20 ring-2 ring-primary ring-inset': isSelected(day) && !day.disabled && !day.past,
          'text-text-light dark:text-slate-200 bg-card-light dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700/20': !day.disabled && !day.past && !isSelected(day)
        }"
        (click)="!day.disabled && !day.past && emitOpen(i)"
      >
        <ng-container *ngIf="day.date">
          <ng-container *ngIf="day.date.toDateString() === todayString; else normalDayMobile">
            <div class="w-8 h-8 rounded-full bg-slate-900 dark:bg-slate-100 flex items-center justify-center text-white dark:text-slate-900 text-sm font-bold">
              {{ day.date.getDate() }}
            </div>
          </ng-container>

          <ng-template #normalDayMobile>
            <span
              class="text-sm"
              [ngClass]="{
                'text-gray-400 dark:text-slate-500': day.disabled,
                'text-subtext-light dark:text-slate-400': day.past && !day.disabled,
                'text-text-light dark:text-slate-200': !day.disabled && !day.past
              }"
            >
              {{ day.date.getDate() }}
            </span>
          </ng-template>

          <div *ngIf="day.items?.length" class="absolute bottom-1.5 flex gap-0.5">
            <div
              *ngFor="let _ of dotsArray(day.items)"
              class="w-1 h-1 rounded-full"
              [ngClass]="{ 'bg-primary': !day.disabled && !day.past, 'bg-slate-300 dark:bg-slate-600': day.past }"
            ></div>
          </div>
        </ng-container>
      </button>
    </div>
  </div>

  <div class="hidden lg:block">
    <div class="grid grid-cols-7 gap-px bg-border-light dark:bg-slate-700 border border-border-light dark:border-slate-700 overflow-hidden">
      <div
        *ngFor="let lbl of ['DOM','SEG','TER','QUA','QUI','SEX','SAB']"
        class="py-3 text-center border-r last:border-r-0 border-border-light dark:border-slate-700 bg-gray-50 dark:bg-slate-900/40"
      >
        <span class="text-xs font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest">{{ lbl }}</span>
      </div>
    </div>

    <div class="grid grid-cols-7 gap-px bg-border-light dark:bg-slate-700 border-x border-b border-border-light dark:border-slate-700 overflow-hidden min-h-[800px]">
      <div
        *ngFor="let day of monthDays; let i = index"
        class="min-h-[160px] flex flex-col"
        [ngClass]="{
          'bg-gray-50/50 dark:bg-slate-900/20': day.disabled,
          'text-gray-400 dark:text-slate-600': day.disabled,
          'bg-gray-50 dark:bg-slate-900/30 opacity-70 grayscale cursor-not-allowed': day.past && !day.disabled,
          'hover:bg-gray-100 dark:hover:bg-slate-700/20 transition-colors cursor-pointer bg-card-light dark:bg-slate-800': !day.disabled && !day.past,
          'bg-gray-50 dark:bg-slate-900/20': day.past && !day.disabled
        }"
      >
        <div class="flex p-2">
          <span
            class="text-xs font-medium"
            [ngClass]="{
              'w-6 h-6 flex items-center justify-center bg-primary text-white rounded-full': day.date?.toDateString() === todayString,
              'text-subtext-light dark:text-slate-400': day.date?.toDateString() !== todayString && !day.disabled,
              'text-gray-300 dark:text-slate-600': day.disabled
            }"
          >
            {{ day.date?.getDate() }}
          </span>
        </div>

        <div
          class="px-2 pb-2 space-y-2 overflow-y-auto flex-grow min-h-[60px]"
          *ngIf="day.date"
          cdkDropList
          [id]="'month-day-' + dateKey(day.date)"
          [cdkDropListData]="day.items"
          [cdkDropListConnectedTo]="connectedDropLists"
          (cdkDropListDropped)="onDrop($event, dateKey(day.date))"
          (click)="!day.disabled && !day.past && emitOpen(i)"
        >
          <div
            *ngFor="let it of day.items; let j = index"
            class="p-2 rounded-md text-xs truncate flex justify-between items-start border border-border-light dark:border-slate-700 bg-gray-50 dark:bg-slate-800/40 border-l-[3px] cursor-move"
            [ngClass]="getCategoryBarClass(it.category)"
            cdkDrag
            [cdkDragDisabled]="day.past || day.disabled"
          >
            <div class="truncate flex items-center flex-1" (click)="emitOpenItem(i, j)">
              <div class="truncate">
                <p class="font-semibold truncate text-text-light dark:text-white">{{ it.name }}</p>
                <p class="text-[10px] font-semibold uppercase tracking-wide" [ngClass]="getCategoryLabelClass(it.category)">{{ it.category }}</p>
              </div>
            </div>
            <button
              type="button"
              (click)="emitRemove(i, j, $event)"
              class="opacity-60 hover:opacity-100 hover:text-red-500 dark:hover:text-red-400 flex-shrink-0 ml-2"
              aria-label="Remover"
              title="Remover"
            >
              <span class="material-icons text-[13px]">delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #monthlySkeleton>
  <div class="calendar-grid border border-border-light dark:border-slate-700 rounded-lg overflow-hidden" aria-hidden="true">
    <div *ngFor="let _ of [].constructor(42)" class="calendar-day bg-card-light dark:bg-slate-800">
      <app-skeleton [rows]="1" widthClass="w-8" heightClass="h-4" [gap]="0"></app-skeleton>
    </div>
  </div>
</ng-template>
