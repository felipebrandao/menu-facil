<ng-container *ngIf="!isLoading; else weeklySkeleton">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-px bg-border-light dark:bg-slate-700 border border-border-light dark:border-slate-700 rounded-lg overflow-hidden">
    <div
      *ngFor="let day of week; let i = index"
      class="min-h-[12rem] p-1.5 flex flex-col transition-colors"
      [ngClass]="{
        'bg-gray-50 dark:bg-slate-900/30 opacity-70 grayscale': isPastDay(day.date),
        'bg-card-light dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700/20 cursor-pointer': !isPastDay(day.date)
      }"
      (click)="!isPastDay(day.date) && emitOpen(i)"
    >
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="text-sm font-semibold text-text-light dark:text-white">
            {{ day.label }}
          </div>
        </div>

        <span
          class="text-xs px-2 py-0.5 rounded-full"
          [ngClass]="{
            'bg-primary text-white': day.date.toDateString() === todayString,
            'bg-gray-100 dark:bg-slate-700 text-subtext-light dark:text-slate-300': day.date.toDateString() !== todayString
          }"
        >
          {{ day.date | date:'dd/MM' }}
        </span>
      </div>

      <div
        class="flex-grow space-y-2 overflow-y-auto custom-scrollbar min-h-[80px]"
        cdkDropList
        [id]="'week-day-' + i"
        [cdkDropListData]="day.items"
        [cdkDropListConnectedTo]="connectedDropLists"
        (cdkDropListDropped)="onDrop($event, i)"
      >
        <div
          *ngFor="let it of day.items; let j = index"
          class="p-2 rounded-md text-xs truncate flex justify-between items-start border border-border-light dark:border-slate-700 bg-gray-50 dark:bg-slate-800/40 border-l-[3px] cursor-move"
          [ngClass]="getCategoryBarClass(it.category)"
          cdkDrag
          [cdkDragDisabled]="isPastDay(day.date)"
        >
          <div class="truncate flex items-center flex-1" (click)="emitOpenItem(i, j)">
            <div class="truncate">
              <p class="font-semibold truncate text-text-light dark:text-white">{{ it.name }}</p>
              <p class="text-[10px] font-semibold uppercase tracking-wide" [ngClass]="getCategoryLabelClass(it.category)">{{ it.category }}</p>
            </div>
          </div>
          <button
            (click)="emitRemove(i, j); $event.stopPropagation()"
            title="Remover"
            class="opacity-60 hover:opacity-100 hover:text-red-500 dark:hover:text-red-400 flex-shrink-0 ml-2"
          >
            <span class="material-icons text-sm">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #weeklySkeleton>
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-px bg-border-light dark:bg-slate-700 border border-border-light dark:border-slate-700 rounded-lg overflow-hidden"
    aria-hidden="true"
  >
    <div *ngFor="let _ of [1,2,3,4,5,6,7]" class="min-h-[12rem] p-1.5 flex flex-col bg-card-light dark:bg-slate-800">
      <div class="flex items-center justify-between mb-2">
        <app-skeleton [rows]="1" widthClass="w-16" heightClass="h-4" [gap]="0"></app-skeleton>
        <app-skeleton [rows]="1" widthClass="w-12" heightClass="h-5" [rounded]="true" [gap]="0"></app-skeleton>
      </div>

      <div class="space-y-2">
        <div class="p-2 rounded-md bg-background-light dark:bg-slate-900 border border-border-light dark:border-slate-700">
          <app-skeleton [rows]="1" widthClass="w-3/4" heightClass="h-4" [gap]="0"></app-skeleton>
          <div class="mt-2">
            <app-skeleton [rows]="1" widthClass="w-1/2" heightClass="h-3" [gap]="0"></app-skeleton>
          </div>
        </div>

        <div class="p-2 rounded-md bg-background-light dark:bg-slate-900 border border-border-light dark:border-slate-700">
          <app-skeleton [rows]="1" widthClass="w-4/5" heightClass="h-4" [gap]="0"></app-skeleton>
          <div class="mt-2">
            <app-skeleton [rows]="1" widthClass="w-2/5" heightClass="h-3" [gap]="0"></app-skeleton>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
