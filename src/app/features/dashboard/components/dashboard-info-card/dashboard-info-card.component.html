<div class="bg-card-light dark:bg-card-dark p-6 rounded-lg shadow-md">
  <p
    class="text-sm font-medium mb-1"
    [ngClass]="{
    'text-green-500': cardColor === 'green',
    'text-blue-500': cardColor === 'blue',
    'text-yellow-500': cardColor === 'yellow'
  }"
  >
    {{ tagText }}
  </p>
  <h3 class="text-xl font-semibold mb-2 text-text-light dark:text-text-dark">{{ title }}</h3>
  <p class="text-subtext-light dark:text-subtext-dark mb-4 text-sm">{{ description }}</p>
  <a
    [routerLink]="linkUrl"
    class="w-full flex justify-center items-center space-x-2 px-4 py-3 rounded-lg transition-colors font-medium"
    [ngClass]="{
    'bg-green-100 dark:bg-green-800 text-green-600 dark:text-green-300 hover:bg-green-200 dark:hover:bg-green-700': cardColor === 'green',
    'bg-blue-100 dark:bg-blue-800 text-blue-600 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-700': cardColor === 'blue',
    'bg-yellow-100 dark:bg-yellow-800 text-yellow-600 dark:text-yellow-300 hover:bg-yellow-200 dark:hover:bg-yellow-700': cardColor === 'yellow'
  }"
  >
    <span>{{ linkText }}</span>
    <span class="material-icons">{{ linkIcon }}</span>
  </a>
</div>
