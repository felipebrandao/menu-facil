<div class="fixed inset-0 z-50 flex items-start justify-center p-4" role="dialog" aria-modal="true">
  <div
    class="absolute inset-0 bg-black/50 backdrop-blur-sm"
    (click)="cancel()"
    aria-hidden="true">
  </div>

  <div
    class="relative z-10 mt-10 w-full max-w-xl rounded-lg border border-border-light dark:border-border-dark
           bg-white dark:bg-gray-900 p-6 shadow-xl flex flex-col max-h-[90vh]"
    [formGroup]="form">

    <h2 class="text-xl font-bold">
      {{ formData?.id ? 'Editar Ingrediente' : 'Novo Ingrediente' }}
    </h2>

    <div class="<>mt-6 space-y-6 overflow-y-auto pr-2 flex-1</>">
      <ng-container *ngIf="!isModalLoading; else loadingTpl">
      <div class="flex flex-col">
        <label class="text-sm font-medium pb-2" for="ingredient-name">Nome</label>
        <input
          id="ingredient-name"
          type="text"
          autocomplete="off"
          formControlName="name"
          class="form-input w-full rounded-md border-border-light dark:border-border-dark
                 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary text-sm"
          placeholder="ex.: Farinha de trigo"/>
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-medium pb-2" for="category">Categoria</label>

        <select
          id="category"
          formControlName="category"
          class="form-select w-full rounded-md border-border-light dark:border-border-dark
                 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary text-sm">
          <option value="">Selecione</option>
          <option *ngIf="loadingCategories" disabled>Carregando...</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-medium pb-2" for="default-unit">Unidade Padrão</label>

        <select
          id="default-unit"
          formControlName="defaultUnit"
          class="form-select w-full rounded-md border-border-light dark:border-border-dark
                 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary text-sm">
          <option value="">Selecione</option>
          <option *ngIf="loadingUnits" disabled>Carregando...</option>
          <option *ngFor="let u of units" [value]="u.id">
            {{ u.abbreviation }} - {{ u.name }}
          </option>
        </select>
      </div>

      <div class="border-t border-border-light dark:border-border-dark pt-6">
        <h3 class="text-lg font-semibold">Adicionar Conversão</h3>

        <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">

          <div class="flex flex-col">
            <label class="text-sm font-medium pb-2" for="to-unit">Converter para Unidade</label>
            <select
              id="to-unit"
              [formControl]="newConversionToUnit"
              class="form-select w-full rounded-md border-border-light dark:border-border-dark
         bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary text-sm">
              <option value="">Selecione</option>
              <option *ngFor="let u of units" [value]="u.id">
                {{ u.abbreviation }} - {{ u.name }}
              </option>
            </select>
          </div>

          <div class="flex flex-col">
            <label class="text-sm font-medium pb-2" for="factor">Fator de Conversão</label>
            <input
              id="factor"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              [formControl]="newConversionFactor"
              class="form-input w-full rounded-md border-border-light dark:border-border-dark
         bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary text-sm"
              placeholder="ex.: 120"/>
          </div>

        </div>

        <button type="button"
                (click)="confirmAddConversion()"
                [disabled]="newConversion.invalid"
                class="mt-4 flex w-full items-center justify-center gap-2 rounded-md bg-primary/10 px-4 py-2
                       text-sm font-semibold text-primary hover:bg-primary/20 disabled:opacity-40">
          <span class="material-symbols-outlined text-lg">add_circle</span>
          Adicionar Conversão
        </button>
      </div>

      <div *ngIf="conversions.length > 0" class="border-t border-border-light dark:border-border-dark pt-6" formArrayName="conversions">
        <h3 class="text-lg font-semibold">Conversões cadastradas</h3>

        <div class="mt-4 space-y-3">
          <div *ngFor="let conv of conversions.controls; let i = index"
               [formGroupName]="i"
               class="flex items-center justify-between rounded-md bg-background-light
                dark:bg-background-dark p-3">

            <p class="text-sm">
        <span class="font-semibold">
          1 {{ unitLabel(conv.get('toUnit')?.value) }}
        </span>
              = {{ conv.get('factor')?.value }} {{ unitLabel(form.get('defaultUnit')?.value) || 'unid.' }}
            </p>

            <button type="button"
                    (click)="removeConversion(i)"
                    class="text-subtle-text-light text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20"
                    aria-label="Remover conversão">
              <span class="material-symbols-outlined text-lg">delete</span>
            </button>
          </div>
        </div>
      </div>
      </ng-container>

      <ng-template #loadingTpl>
        <div class="space-y-4">
          <app-skeleton [rows]="2" widthClass="w-3/4" heightClass="h-5"></app-skeleton>
          <app-skeleton [rows]="1" widthClass="w-1/2" heightClass="h-5"></app-skeleton>
          <app-skeleton [rows]="3"></app-skeleton>
        </div>
      </ng-template>
    </div>

    <div class="flex justify-end gap-3 border-t border-border-light dark:border-border-dark pt-6 mt-4">
      <button type="button"
              (click)="cancel()"
              class="rounded-md px-4 py-2 text-sm font-semibold
                     text-subtle-text-light dark:text-subtle-text-dark
                     hover:bg-gray-100 dark:hover:bg-gray-800">
        Cancelar
      </button>

      <button type="button"
              (click)="save()"
              [disabled]="form.invalid || isSaving"
              class="rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white
                     hover:bg-primary/90 disabled:opacity-50">
        {{ isSaving ? 'Salvando...' : (formData?.id ? 'Salvar Alterações' : 'Salvar Ingrediente') }}
      </button>
    </div>

  </div>
</div>
