<div class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-900 rounded-lg shadow-xl w-full max-w-md">
    <div class="p-6 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 dark:bg-red-900">
        <span class="material-symbols-outlined text-red-600 dark:text-red-400" style="font-size: 28px;">
          error
        </span>
      </div>
      <h3 class="mt-5 text-lg font-medium leading-6 text-gray-900 dark:text-white">{{ message }}</h3>
      <div class="mt-2">
        <p class="text-sm text-gray-500 dark:text-gray-400">{{ details }}</p>
      </div>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700/50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-lg">
      <button
        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-primary text-base font-medium text-white hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:ml-3 sm:w-auto sm:text-sm"
        type="button"
        (click)="retry.emit()"
      >Tentar Novamente</button>
      <button
        class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:mt-0 sm:w-auto sm:text-sm"
        type="button"
        (click)="cancel.emit()"
      >Cancelar</button>
    </div>
  </div>
</div>
