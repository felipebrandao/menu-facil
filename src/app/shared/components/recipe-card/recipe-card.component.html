<div
  class="bg-card-light dark:bg-card-dark rounded-lg shadow-md overflow-hidden transform hover:-translate-y-1 transition-transform duration-300 cursor-pointer"
  [routerLink]="['/recipes', id]"
  tabindex="0"
  (keydown)="onKeydown($event)"
>
  <div class="relative">
    <ng-container *ngIf="!imageError; else placeholder">
      <img
        [src]="image"
        [alt]="title"
        class="w-full h-48 object-cover"
        (error)="onImageError()"
      />
    </ng-container>
    <ng-template #placeholder>
      <div class="w-full h-48 bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
        <span class="material-icons text-gray-400 dark:text-gray-500" style="font-size: 48px;">image</span>
      </div>
    </ng-template>
  </div>

  <div class="p-4">
    <h3 class="font-semibold text-lg">{{ title }}</h3>
    <p class="text-sm text-subtext-light dark:text-subtext-dark">{{ category }}</p>

    <p *ngIf="author" class="text-text-light/70 dark:text-text-dark/70 text-sm font-medium leading-normal mt-1">
      por &#64;{{ author }}
    </p>

    <div class="flex items-center justify-between mt-3 text-sm">
      <div class="flex items-center gap-1">
        <span class="material-icons text-yellow-500 text-base" aria-hidden="true">star</span>
        <span class="font-bold" *ngIf="rating !== undefined">{{ rating | number:'1.1-1' }}</span>
        <span *ngIf="reviewsCount !== undefined" class="text-xs text-gray-500 dark:text-gray-400">({{ reviewsCount }})</span>
      </div>

      <div class="flex items-center gap-1.5 text-text-light/70 dark:text-text-dark/70">
        <button (click)="toggleFavorite($event)" aria-label="Favoritar" class="p-0">
          <span class="material-icons text-base" [ngClass]="{'text-red-500': isFavorite}" aria-hidden="true">
            {{ isFavorite ? 'favorite' : 'favorite_border' }}
          </span>
        </button>
      </div>
    </div>

    <div class="mt-3 flex gap-2 justify-end w-full">
      <button (click)="onAddToShoppingList($event)" class="flex items-center justify-center gap-x-1 rounded-lg h-8 px-2 bg-primary/20 dark:bg-primary/30 text-xs font-bold text-gray-800 dark:text-gray-200 hover:bg-primary/30 dark:hover:bg-primary/40" aria-label="Adicionar à lista de compras">
        <span class="material-symbols-outlined text-sm">playlist_add</span>
        <span>Lista</span>
      </button>

      <button (click)="onAddToSchedule($event)" class="flex items-center justify-center gap-x-1 rounded-lg h-8 px-2 bg-primary/20 dark:bg-primary/30 text-xs font-bold text-gray-800 dark:text-gray-200 hover:bg-primary/30 dark:hover:bg-primary/40" aria-label="Adicionar ao cronograma">
        <span class="material-symbols-outlined text-sm">calendar_month</span>
        <span>Cronograma</span>
      </button>
    </div>
  </div>
</div>
