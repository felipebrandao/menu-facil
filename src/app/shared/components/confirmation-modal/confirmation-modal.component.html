<div class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-900 rounded-lg shadow-xl w-full max-w-md">
    <div class="p-6 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full"
           [ngClass]="isDangerous ? 'bg-red-100 dark:bg-red-900' : 'bg-amber-100 dark:bg-amber-900'">
        <span class="material-symbols-outlined text-3xl"
              [ngClass]="isDangerous ? 'text-red-600 dark:text-red-400' : 'text-amber-600 dark:text-amber-400'">
          {{ isDangerous ? 'warning' : 'help' }}
        </span>
      </div>
      <h3 class="mt-5 text-lg font-medium leading-6 text-gray-900 dark:text-white">{{ title }}</h3>
      <div class="mt-2">
        <p class="text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>
      </div>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700/50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-lg gap-2">
      <button
        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 sm:w-auto sm:text-sm"
        [ngClass]="isDangerous ? 'bg-red-600 hover:bg-red-700 focus:ring-red-500' : 'bg-primary hover:bg-green-600 focus:ring-primary'"
        type="button"
        (click)="confirm.emit()"
      >{{ confirmText }}</button>
      <button
        class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary sm:mt-0 sm:w-auto sm:text-sm"
        type="button"
        (click)="cancel.emit()"
      >{{ cancelText }}</button>
    </div>
  </div>
</div>
