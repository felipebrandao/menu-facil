<div class="bg-card-light dark:bg-card-dark rounded-lg shadow-md overflow-hidden transform hover:-translate-y-1 transition-transform duration-300">
  <img [src]="image" [alt]="title" class="w-full h-48 object-cover" />
  <div class="p-4">
    <h3 class="font-semibold text-lg">{{ title }}</h3>
    <p class="text-sm text-subtext-light dark:text-subtext-dark">{{ category }}</p>
  </div>
</div>
