<input class="peer hidden" id="sidebar-toggle" type="checkbox"/>

          <label
            aria-label="Fechar sidebar"
            class="fixed inset-0 bg-black/50 z-40 hidden peer-checked:block md:peer-checked:hidden backdrop-blur-sm transition-opacity"
            for="sidebar-toggle">
          </label>

          <aside class="fixed top-0 left-0 z-[60] h-full w-64 bg-surface-light dark:bg-surface-dark border-r border-gray-200 dark:border-gray-800 transform -translate-x-full peer-checked:translate-x-0 transition-transform duration-300 md:hidden flex flex-col shadow-2xl">
            <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between h-16">
              <a routerLink="/dashboard" class="flex items-center gap-2">
                <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
                </svg>
                <h2 class="text-lg font-bold dark:text-white">Menu Fácil</h2>
              </a>
              <label class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white cursor-pointer rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" for="sidebar-toggle">
                <span class="material-icons">close</span>
              </label>
            </div>

            <nav class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-2">
              <a (click)="closeSidebar()" routerLink="/my-recipes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-gray-700 hover:bg-gray-100 hover:text-primary dark:text-gray-300 dark:hover:bg-gray-800 transition-colors">
                <span class="material-icons">menu_book</span>
                Receitas
              </a>
              <a (click)="closeSidebar()" href="/schedule" class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-gray-700 hover:bg-gray-100 hover:text-primary dark:text-gray-300 dark:hover:bg-gray-800 transition-colors">
                <span class="material-icons">calendar_today</span>
                Cronograma
              </a>
              <a (click)="closeSidebar()" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-gray-700 hover:bg-gray-100 hover:text-primary dark:text-gray-300 dark:hover:bg-gray-800 transition-colors">
                <span class="material-icons">shopping_cart</span>
                Lista de Compras
              </a>
            </nav>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900">
              <a (click)="closeSidebar()" routerLink="/settings/profile" class="flex items-center gap-3 mb-4">
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border-2 border-primary/20"
                     style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDKskJ8v5fP0bhewPJz53R8DpVjLP2PEMlZgKdpMTVkucqVxe_RiVdDfb1jZOGhOwHagLNAP9PAijlXyrjU-VllM-88QnkmkWSyMQ_Vyhn-IVrmbGONhVFbpRkOf9noLxSeBLOhSE-nRsmuzN624Rze4TbnNrDUHryysPpDVHAiCiq8zVpq6OaS1JLWXvaWhVchrs7BJ7Q_I5kgnY9N15I1Y_w2UBhfkRizzkcjWuBewX-ih-1RQd956S24U3WisMdUvJPTc_PNIDM3");'>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-bold text-gray-900 dark:text-white truncate">Minha Conta</p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 truncate">Ver perfil</p>
                </div>
              </a>
            </div>
          </aside>

          <header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-800">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                  <label class="md:hidden p-2 text-gray-600 dark:text-gray-300 cursor-pointer rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" for="sidebar-toggle">
                    <span class="material-icons">menu</span>
                  </label>
                  <a routerLink="/dashboard" class="flex items-center gap-4">
                    <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
                    </svg>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">Menu Fácil</h1>
                  </a>
                </div>

                <nav class="hidden md:flex items-center space-x-6">
                  <a routerLink="/my-recipes" class="flex items-center space-x-2 text-subtext-light dark:text-subtext-dark hover:text-text-light dark:hover:text-text-dark">
                    <span class="material-icons">menu_book</span>
                    <span>Receitas</span>
                  </a>
                  <a class="flex items-center space-x-2 text-subtext-light dark:text-subtext-dark hover:text-text-light dark:hover:text-text-dark" href="/schedule">
                    <span class="material-icons">calendar_today</span>
                    <span>Cronograma</span>
                  </a>
                  <a class="flex items-center space-x-2 text-subtext-light dark:text-subtext-dark hover:text-text-light dark:hover:text-text-dark" href="#">
                    <span class="material-icons">shopping_cart</span>
                    <span>Lista de Compras</span>
                  </a>
                </nav>

                <div class="flex items-center gap-4">
                  <button (click)="toggleDarkMode()" class="text-subtext-light dark:text-subtext-dark hover:text-text-light dark:hover:text-text-dark">
                    <span class="material-icons">
                      {{ isDarkMode ? 'light_mode' : 'dark_mode' }}
                    </span>
                  </button>
                  <button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                    <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">notifications</span>
                  </button>
                  <a routerLink="/settings/profile" class="w-10 h-10 rounded-full bg-cover bg-center block hidden md:block" aria-label="Abrir perfil" title="Abrir perfil" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDKskJ8v5fP0bhewPJz53R8DpVjLP2PEMlZgKdpMTVkucqVxe_RiVdDfb1jZOGhOwHagLNAP9PAijlXyrjU-VllM-88QnkmkWSyMQ_Vyhn-IVrmbGONhVFbpRkOf9noLxSeBLOhSE-nRsmuzN624Rze4TbnNrDUHryysPpDVHAiCiq8zVpq6OaS1JLWXvaWhVchrs7BJ7Q_I5kgnY9N15I1Y_w2UBhfkRizzkcjWuBewX-ih-1RQd956S24U3WisMdUvJPTc_PNIDM3");'>
                  </a>
                </div>
              </div>
            </div>
          </header>
